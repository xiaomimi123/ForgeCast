name: forgecast           # 固定 project name（仓库路径含中文，否则派生的 project name 为空会报错）

services:
  app:                      # Hono API + CLI 入口
    build: .
    ports: ["127.0.0.1:4321:4321"]
    volumes:
      - ./workspace:/app/workspace
      - ./db:/app/db
      - ./templates:/app/templates
    env_file: .env

