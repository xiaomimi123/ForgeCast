<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "NotoSC"; src: url("assets/fonts/NotoSansSC.otf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d1117; font-family: "NotoSC", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .fill { position: absolute; inset: 0; } .pad { padding: 90px; }
      .center { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
      .hookT { font-size: 96px; font-weight: 900; line-height: 1.28; color: #fff; }
      .pain { font-size: 60px; font-weight: 700; color: #fff; margin: 22px 0; opacity: .95; }
      .painWrap { display: flex; flex-direction: column; justify-content: center; }
      .price { font-size: 76px; font-weight: 800; color: #ffd54f; line-height: 1.4; }
      .cta { font-size: 76px; font-weight: 800; color: #fff; margin-bottom: 36px; }
      .brand { font-size: 40px; color: #8888aa; }
      /* 科技感背景变体（可 --bg=grid|aurora|matrix|synth|mesh 切换，替掉纯色底） */
      #techbg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
      #techbg .vig { position: absolute; inset: 0; box-shadow: inset 0 0 420px rgba(0,0,0,.72); }
      /* grid 赛博网格 */
      .bg-grid { background:
        radial-gradient(1200px 900px at 50% 20%, rgba(34,98,168,.38), transparent 62%),
        radial-gradient(1100px 850px at 82% 92%, rgba(96,52,168,.30), transparent 60%),
        linear-gradient(165deg, #0a0e1a, #0d1117 55%, #080a11); }
      .bg-grid .mv { position: absolute; inset: -25%;
        background-image: linear-gradient(rgba(96,178,255,.11) 2px, transparent 2px), linear-gradient(90deg, rgba(96,178,255,.11) 2px, transparent 2px);
        background-size: 80px 80px;
        -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 52%, transparent 84%); mask-image: radial-gradient(circle at 50% 45%, #000 52%, transparent 84%); }
      .bg-grid .sweep { position: absolute; top: -50%; left: -30%; width: 55%; height: 200%;
        background: linear-gradient(105deg, transparent, rgba(120,200,255,.10), transparent); transform: skewX(-12deg); }
      /* aurora 极光 */
      .bg-aurora { background: linear-gradient(160deg, #07101a, #0a1020 60%, #0b0a18); }
      .bg-aurora .mv { position: absolute; inset: -30%; filter: blur(30px);
        background:
          radial-gradient(600px 380px at 30% 30%, rgba(40,180,150,.34), transparent 60%),
          radial-gradient(680px 420px at 72% 40%, rgba(60,120,230,.32), transparent 62%),
          radial-gradient(560px 400px at 50% 80%, rgba(150,60,210,.30), transparent 62%); }
      /* matrix 数据雨 */
      .bg-matrix { background: linear-gradient(180deg, #020806, #04120b 50%, #020806); }
      .bg-matrix .mv { position: absolute; left: 0; right: 0; top: -100%; height: 200%; opacity: .5;
        background-image: repeating-linear-gradient(0deg, rgba(0,255,140,.18) 0 2px, transparent 2px 26px);
        -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 42px); mask-image: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 42px); }
      /* synth 合成波 */
      .bg-synth { background: linear-gradient(180deg, #160a2a 0%, #2a1150 42%, #4a1a5e 52%, #0a0618 52%, #0a0618 100%); }
      .bg-synth .sun { position: absolute; left: 50%; top: 34%; width: 520px; height: 520px; transform: translate(-50%,-50%); border-radius: 50%;
        background: radial-gradient(circle, #ff8a3d 0%, #ff4d8d 46%, rgba(255,77,141,0) 70%); filter: blur(6px); }
      .bg-synth .mv { position: absolute; left: -20%; right: -20%; bottom: 0; height: 48%; transform: perspective(320px) rotateX(72deg); transform-origin: bottom;
        background-image: linear-gradient(rgba(255,90,200,.5) 2px, transparent 2px), linear-gradient(90deg, rgba(120,120,255,.45) 2px, transparent 2px);
        background-size: 70px 70px; }
      /* mesh 深空 */
      .bg-mesh { background:
        radial-gradient(900px 700px at 28% 26%, rgba(70,40,150,.42), transparent 60%),
        radial-gradient(1000px 800px at 78% 74%, rgba(30,70,150,.36), transparent 62%),
        linear-gradient(160deg, #060812, #0a0a16 60%, #05040d); }
      .bg-mesh .mv { position: absolute; inset: 0; opacity: .5;
        background-image: radial-gradient(rgba(150,180,255,.25) 1.5px, transparent 1.5px); background-size: 46px 46px;
        -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 40%, transparent 80%); mask-image: radial-gradient(circle at 50% 50%, #000 40%, transparent 80%); }
      /* 手机外框：竖图铺满机身（外框透明，透出科技背景） */
      .phoneWrap { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: transparent; }
      .phone { width: 620px; height: 1340px; border: 14px solid #21262d; border-radius: 64px; overflow: hidden; position: relative; background: #000; }
      .phone::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 180px; height: 36px; background: #21262d; border-radius: 0 0 22px 22px; z-index: 2; }
      .phone img { width: 100%; height: 100%; object-fit: cover; }
      /* 横图：居中缩放 + 同图虚化背景 */
      .wideWrap { position: absolute; inset: 0; overflow: hidden; }
      .wideBg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) brightness(.45); }
      .wideFg { position: absolute; inset: 0; display: flex; align-items: center; }
      .wideFg img { width: 100%; }
      .cap { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center; font-size: 46px; font-weight: 800; color: #fff; padding: 0 70px; text-shadow: 0 4px 22px rgba(0,0,0,.9); z-index: 5; }
      /* 逐字解码/故障风：每字叠「乱码层 .gh + 最终字 .fin」，靠 opacity 点亮做扫描→锁定 */
      .twc { position: relative; display: inline-block; }
      .twc .gh { position: absolute; left: 0; top: 0; color: #5cf; text-shadow: 0 0 18px rgba(90,200,255,.95), 0 0 4px rgba(90,200,255,.9); }
      .twc .fin { text-shadow: 0 0 12px rgba(120,190,255,.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="1920">
      <!--HF_BG-->
      <!--HF_SECTIONS-->
      <!--HF_CAPTIONS-->
      <!--HF_AUDIO-->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 轻微运镜（整体缓慢放大），具体分镜显隐交给 HyperFrames clip 时间轴
      tl.fromTo("#root", { scale: 1 }, { scale: 1.03, duration: {{duration}}, ease: "none" }, 0);
      // 科技背景微动（按所选变体注入，GSAP 线性可 seek）
      <!--HF_BGANIM-->
      <!--HF_ACCENTS-->
      // 逐字解码出场：.tw 文字拆成单字，随所属 clip 的 data-start 逐字敲出；
      // 每字先闪几帧随机乱码（.gh 青色辉光）再锁定最终字（.fin）。全程只动 opacity
      // （不改 textContent——后者在逐帧 seek 渲染下不生效，见 injectAudioCaptions 注释）。
      (function () {
        var POOL = '日月火水木金土山川云电系统数据端口零一二三ABCDEF0123456789#@%&*<>/|=+アイウエオカキクケコサシスセソ';
        function rc() { return POOL[(Math.random() * POOL.length) | 0]; }
        var K = 5, gstep = 0.045; // 乱码帧数 + 每帧停留
        document.querySelectorAll('.tw').forEach(function (el) {
          var clip = el.closest('.clip') || el;
          var start = parseFloat(clip.getAttribute('data-start') || '0');
          var chars = Array.from(el.textContent);
          el.textContent = '';
          var step = Math.min(0.055, 1.1 / Math.max(1, chars.length)); // 打字速度（长文本更快，整体≤~1.1s）
          chars.forEach(function (ch, i) {
            var t0 = start + i * step;
            var c = document.createElement('span');
            c.className = 'twc';
            if (ch === ' ') { c.innerHTML = '&nbsp;'; el.appendChild(c); tl.set(c, { opacity: 0 }, 0); tl.set(c, { opacity: 1 }, t0); return; }
            var fin = document.createElement('span'); fin.className = 'fin'; fin.textContent = ch; c.appendChild(fin);
            var ghosts = [];
            for (var j = 0; j < K; j++) { var g = document.createElement('span'); g.className = 'gh'; g.textContent = rc(); c.appendChild(g); ghosts.push(g); }
            el.appendChild(c);
            tl.set(c, { opacity: 0 }, 0); tl.set(c, { opacity: 1 }, t0);
            tl.set(fin, { opacity: 0 }, 0);
            ghosts.forEach(function (g, j) {
              tl.set(g, { opacity: 0 }, 0);
              tl.set(g, { opacity: 1 }, t0 + j * gstep);
              tl.set(g, { opacity: 0 }, t0 + (j + 1) * gstep);
            });
            tl.set(fin, { opacity: 1 }, t0 + K * gstep);
          });
        });
      })();
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
