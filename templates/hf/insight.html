<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "NotoSC"; src: url("assets/fonts/NotoSansSC.otf"), local("PingFang SC"), local("Noto Sans CJK SC"); font-weight: 400; }
      @font-face { font-family: "NotoSC"; src: url("assets/fonts/NotoSansSC-Bold.otf"), local("PingFang SC Semibold"), local("Noto Sans CJK SC Bold"); font-weight: 700 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0f; font-family: "NotoSC", sans-serif; }
      .fill { position: absolute; inset: 0; } .pad { padding: 90px; }
      .center { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
      .painT { font-size: 100px; font-weight: 900; line-height: 1.28; color: #fff; }
      .cta { font-size: 76px; font-weight: 800; color: #fff; margin-bottom: 36px; }
      .brand { font-size: 40px; color: #8888aa; }
      /* 数据卡片：全部居中、宽度都 ≥55% 画布宽（900/820/760 / 1080 = 83%/76%/70%），
         只堆在画布下半区（top ≥ 1000，画布高 1920，垂直中线 960 以下）——上半区完全留白，
         构成"至少一个空象限"且不是缩在一角（左右都占满，只是上边空）。
         三张卡的堆叠区在 1000~1513px 结束，给 .cap 字幕条（贴 bottom:150px，最多两行时
         顶部约在 1615px）留出 ≥100px 净空——实测两行字幕会和卡片撞在一起，故预留够余量。
         fix round 1：默认就是主视觉尺寸/透明度——谁是主视觉由 buildInsightSections 按
         "此刻谁最新/唯一"算，不再是固定 idx=0；data-idx 只决定三个物理堆叠槽位（避免同屏时
         互相压住），不再决定字号大小。降级（曾经是主视觉、被新卡接棒）靠 GSAP 原生 scale/opacity
         在精确时刻 tl.to 切换（见 hyperframes.ts 里的 demotions）——不能靠 CSS 属性选择器/
         内联自定义变量做：实测 GSAP 一旦接管该元素的 transform/opacity，会连带重写整个内联
         style、CSS 属性选择器规则和后加的自定义变量都不生效。 */
      /* 注：不用 left:50%+transform:translateX 居中——GSAP 动 scale/y 会接管并冲掉这个
         居中 transform，改用固定 left（画布 1080px 减卡宽再除二），每个 idx 各自居中 */
      .card { position: absolute; border: 2px solid var(--card-color, #ffd54f); border-radius: 18px; background: rgba(15,15,15,.9); padding: 18px 26px; transform-origin: top center; }
      .card .stat { font-size: 52px; font-weight: 900; color: var(--card-color, #ffd54f); }
      .card .label { font-size: 24px; color: #f0f0f4; margin-top: 6px; }
      /* data-idx 只管三个槽位互不重叠的物理位置，字号/配色不再按 idx 分档 */
      .card[data-idx="0"] { top: 1000px; left: 90px; width: 900px; }
      .card[data-idx="1"] { top: 1190px; left: 130px; width: 820px; }
      .card[data-idx="2"] { top: 1380px; left: 160px; width: 760px; }
      .cap { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); max-width: 880px; text-align: center; font-size: 44px; font-weight: 700; line-height: 1.35; color: #fff; background: rgba(20,20,20,.82); padding: 18px 34px; border-radius: 14px; z-index: 5; }
      <!--HF_FXCSS-->
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="1920">
      <div id="cam">
      <!--HF_BG-->
      <!--HF_SECTIONS-->
      <!--HF_CAPTIONS-->
      </div>
      <!--HF_AUDIO-->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      <!--HF_CAM-->
      <!--HF_BGANIM-->
      <!--HF_ACCENTS-->

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
