<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "NotoSC"; src: url("assets/fonts/NotoSansSC.otf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0f; font-family: "NotoSC", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .fill { position: absolute; inset: 0; } .pad { padding: 60px 220px; }
      .center { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
      .painT { font-size: 68px; font-weight: 900; line-height: 1.28; color: #fff; }
      .cta { font-size: 56px; font-weight: 800; color: #fff; margin-bottom: 28px; }
      .brand { font-size: 32px; color: #8888aa; }
      /* 数据卡片：横屏靠右侧竖排，避免 left/right 撑满全宽变形 */
      .card { position: absolute; right: 140px; width: 560px; border: 2px solid var(--card-color, #ffd54f); border-radius: 16px; background: rgba(15,15,15,.85); padding: 22px 26px; }
      .card .stat { font-size: 48px; font-weight: 900; color: var(--card-color, #ffd54f); }
      .card .label { font-size: 26px; color: #e5e5e5; margin-top: 6px; }
      .cap { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); max-width: 1300px; text-align: center; font-size: 38px; font-weight: 700; line-height: 1.35; color: #fff; background: rgba(20,20,20,.82); padding: 16px 30px; border-radius: 14px; z-index: 5; }
      <!--HF_FXCSS-->
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
      <!--HF_BG-->
      <!--HF_SECTIONS-->
      <!--HF_CAPTIONS-->
      <!--HF_AUDIO-->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#root", { scale: 1 }, { scale: 1.03, duration: {{duration}}, ease: "none" }, 0);
      <!--HF_BGANIM-->
      <!--HF_ACCENTS-->
      <!--HF_DECODE-->
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
