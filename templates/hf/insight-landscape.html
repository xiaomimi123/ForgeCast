<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "NotoSC"; src: url("assets/fonts/NotoSansSC.otf"); font-weight: 400; }
      @font-face { font-family: "NotoSC"; src: url("assets/fonts/NotoSansSC-Bold.otf"); font-weight: 700 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0f; font-family: "NotoSC", sans-serif; }
      .fill { position: absolute; inset: 0; } .pad { padding: 60px 220px; }
      .center { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
      .painT { font-size: 68px; font-weight: 900; line-height: 1.28; color: #fff; }
      .cta { font-size: 56px; font-weight: 800; color: #fff; margin-bottom: 28px; }
      .brand { font-size: 32px; color: #8888aa; }
      /* 数据卡片：横屏画布 1920x1080，垂直中线 540。卡片全部居中、宽度都 ≥55%
         （1400/1200/1080 / 1920 = 73%/62.5%/56.25%），只堆在下半区（top ≥ 560）——
         上半区（TL/TR）完全留白，构成"至少一个空象限"且左右不空（宽度撑满）。
         --card-color 只由 buildInsightSections 给 idx=0 内联覆盖，其余用灰调默认值。
         用固定 left（而非 transform 居中）：GSAP 动 scale/y 会接管并冲掉居中 transform。 */
      .card { position: absolute; border: 1.5px solid var(--card-color, #6b6b7d); border-radius: 16px; background: rgba(15,15,15,.78); padding: 16px 24px; }
      .card .stat { font-size: 30px; font-weight: 800; color: var(--card-color, #cfcfe0); }
      .card .label { font-size: 18px; color: #c9c9d6; margin-top: 4px; }
      /* idx=0：组内主卡，全宽最大、字号最大、边框加粗——同屏其余卡片必须比它弱 */
      .card[data-idx="0"] { top: 550px; left: 260px; width: 1400px; border-width: 3px; background: rgba(15,15,15,.92); }
      .card[data-idx="0"] .stat { font-size: 52px; font-weight: 900; }
      .card[data-idx="0"] .label { font-size: 24px; color: #f4f4f7; }
      .card[data-idx="1"] { top: 700px; left: 360px; width: 1200px; }
      .card[data-idx="1"] .stat { font-size: 32px; }
      .card[data-idx="2"] { top: 820px; left: 420px; width: 1080px; }
      .card[data-idx="2"] .stat { font-size: 30px; }
      .cap { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); max-width: 1300px; text-align: center; font-size: 38px; font-weight: 700; line-height: 1.35; color: #fff; background: rgba(20,20,20,.82); padding: 16px 30px; border-radius: 14px; z-index: 5; }
      <!--HF_FXCSS-->
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
      <div id="cam">
      <!--HF_BG-->
      <!--HF_SECTIONS-->
      <!--HF_CAPTIONS-->
      <!--HF_AUDIO-->
      </div>
    </div>

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      <!--HF_CAM-->
      <!--HF_BGANIM-->
      <!--HF_ACCENTS-->

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
