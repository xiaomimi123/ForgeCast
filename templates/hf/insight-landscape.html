<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "NotoSC"; src: url("assets/fonts/NotoSansSC.otf"); font-weight: 400; }
      @font-face { font-family: "NotoSC"; src: url("assets/fonts/NotoSansSC-Bold.otf"); font-weight: 700 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0f; font-family: "NotoSC", sans-serif; }
      .fill { position: absolute; inset: 0; } .pad { padding: 60px 220px; }
      .center { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
      .painT { font-size: 68px; font-weight: 900; line-height: 1.28; color: #fff; }
      .cta { font-size: 56px; font-weight: 800; color: #fff; margin-bottom: 28px; }
      .brand { font-size: 32px; color: #8888aa; }
      /* 数据卡片：横屏画布 1920x1080，垂直中线 540。卡片全部居中、宽度都 ≥55%
         （1400/1200/1080 / 1920 = 73%/62.5%/56.25%），只堆在下半区（top ≥ 540）——
         上半区（TL/TR）完全留白，构成"至少一个空象限"且左右不空（宽度撑满）。
         fix round 1：默认就是主视觉尺寸/透明度，谁是主视觉由 buildInsightSections 按
         "此刻谁最新/唯一"算，不再固定 idx=0；data-idx 只决定三个物理槽位（避免同屏互相压住）。
         降级（曾经是主视觉、被新卡接棒）靠 GSAP 原生 scale/opacity 在精确时刻 tl.to 切换——
         不能靠 CSS 属性选择器/内联自定义变量：实测 GSAP 接管该元素 transform/opacity 后会
         连带重写整个内联 style，CSS 属性选择器规则和自定义变量都不生效。
         用固定 left（而非 transform 居中）：GSAP 动 scale/y 会接管并冲掉居中 transform。 */
      .card { position: absolute; border: 2px solid var(--card-color, #ffd54f); border-radius: 16px; background: rgba(15,15,15,.9); padding: 12px 20px; transform-origin: top center; }
      .card .stat { font-size: 32px; font-weight: 900; color: var(--card-color, #ffd54f); }
      .card .label { font-size: 18px; color: #f0f0f4; margin-top: 4px; }
      /* data-idx 只管三个槽位互不重叠的物理位置，字号/配色不再按 idx 分档 */
      .card[data-idx="0"] { top: 540px; left: 260px; width: 1400px; }
      .card[data-idx="1"] { top: 660px; left: 360px; width: 1200px; }
      .card[data-idx="2"] { top: 780px; left: 420px; width: 1080px; }
      .cap { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); max-width: 1300px; text-align: center; font-size: 38px; font-weight: 700; line-height: 1.35; color: #fff; background: rgba(20,20,20,.82); padding: 16px 30px; border-radius: 14px; z-index: 5; }
      <!--HF_FXCSS-->
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
      <div id="cam">
      <!--HF_BG-->

      <!--HF_CAPTIONS-->
      <!--HF_AUDIO-->
      </div>
    </div>

      const tl = gsap.timeline({ paused: true });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
