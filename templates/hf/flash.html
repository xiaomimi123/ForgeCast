<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "NotoSC"; src: url("assets/fonts/NotoSansSC.otf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0f0f1a; font-family: "NotoSC", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .fill { position: absolute; inset: 0; } .pad { padding: 90px; }
      .center { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
      .painT { font-size: 100px; font-weight: 900; line-height: 1.28; color: #fff; }
      .sell { font-size: 72px; font-weight: 800; color: #ffd54f; line-height: 1.4; }
      .cta { font-size: 76px; font-weight: 800; color: #fff; margin-bottom: 36px; }
      .brand { font-size: 40px; color: #8888aa; }
      .cap { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center; font-size: 46px; font-weight: 800; color: #fff; padding: 0 70px; text-shadow: 0 4px 22px rgba(0,0,0,.9); z-index: 5; }
      <!--HF_FXCSS-->
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="1920">
      <!--HF_BG-->
      <div id="s1" class="clip fill pad center" data-start="0" data-duration="4" data-track-index="1">
        <div class="painT tw">{{painTitle}}</div>
      </div>
      <div id="s2" class="clip fill pad center" data-start="4" data-duration="4" data-track-index="1">
        <div class="sell tw">{{sellingPoint}}</div>
      </div>
      <div id="s3" class="clip fill pad center" data-start="8" data-duration="4" data-track-index="1">
        <div class="cta tw">{{cta}}</div><div class="brand">@{{brandName}}</div>
      </div>
      <!--HF_CAPTIONS-->
      <!--HF_AUDIO-->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#root", { scale: 1 }, { scale: 1.03, duration: {{duration}}, ease: "none" }, 0);
      <!--HF_BGANIM-->
      <!--HF_ACCENTS-->
      <!--HF_DECODE-->
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
